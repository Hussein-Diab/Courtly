<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Courtly</title>
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <h1 class="brand">courtly<span>.</span></h1>
    <p class="subtitle">Welcome back. Log in to find your game.</p>

    <form id="login-form" novalidate>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />

      <p id="error" class="error" role="alert"></p>
      <button type="submit">Log in</button>
    </form>

    <p class="switch">New here? <a href="signup.html">Create an account</a></p>
  </main>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
