<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Courtly</title>
  <link rel="stylesheet" href="../css/auth.css" />
</head>
<body>
  <main class="auth-card">
    <h1 class="brand">courtly<span>.</span></h1>
    <p class="subtitle">Create your account in under a minute.</p>

    <form id="signup-form" novalidate>
      <label for="fullName">Full name</label>
      <input id="fullName" name="fullName" type="text" autocomplete="name" required />

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required />

      <label for="password">Password (min 8 characters)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required />

      <label for="role">I want to</label>
      <select id="role" name="role">
        <option value="player">Book fields (Player)</option>
        <option value="owner">List my fields (Owner)</option>
      </select>

      <p id="error" class="error" role="alert"></p>
      <button type="submit">Create account</button>
    </form>

    <p class="switch">Already have an account? <a href="login.html">Log in</a></p>
  </main>
  <script type="module" src="../js/pages/signup.js"></script>
</body>
</html>
